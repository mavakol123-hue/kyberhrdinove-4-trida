<script>
'use strict';
const QUESTIONS=[{"q":"V online hře ti neznámý hráč píše: „Pošli mi svou domácí adresu.“ Co uděláš?","a":["Pošlu mu jen název ulice.","Napíšu adresu, protože je to spoluhráč.","Adresu mu nepošlu a řeknu o zprávě dospělému.","Pošlu adresu, když mi slíbí dárek."],"c":2,"f":["I název ulice může o tobě něco prozradit.","Spoluhráč nemusí být tím, za koho se vydává.","Domácí adresu neznámým lidem nesděluj. Dospělý ti pomůže situaci vyřešit.","Slib dárku není důvod sdělovat osobní údaje."],"tip":"Na internetu nemusí být člověk tím, kým se představuje. Přezdívka ani obrázek profilu nejsou průkaz totožnosti."},{"q":"Kamarád tě prosí o heslo ke školnímu účtu, protože chce vyzkoušet tvoji hru. Co odpovíš?","a":["Heslo mu nedám a nabídnu, že si zahrajeme jinak.","Pošlu mu heslo jen na jeden den.","Napíšu heslo na lístek do lavice.","Řeknu heslo celé třídě, aby bylo fér."],"c":0,"f":["Heslo je soukromý klíč k účtu. Můžeš být dobrý kamarád i bez jeho sdílení.","I jeden den stačí ke zneužití účtu.","Lístek s heslem může najít někdo další.","Více lidí se stejným heslem znamená větší riziko."],"tip":"Dlouhé heslo složené z několika nesouvisejících slov bývá snáze zapamatovatelné než krátká náhodná kombinace."},{"q":"Na obrazovce vyskočí okno „Vyhráváš nový mobil! Klikni hned!“ Jak se zachováš?","a":["Okamžitě vyplním své jméno a adresu.","Nechám si slíbit ještě větší cenu.","Pošlu zprávu všem spolužákům.","Nekliknu na nabídku a poradím se s dospělým."],"c":3,"f":["Neověřené formuláře mohou sloužit ke sbírání osobních údajů.","Ani větší slíbená odměna nedokazuje, že jde o skutečnou výhru.","Podezřelý obsah není dobré šířit dál.","Výhru, do které ses nepřihlásil/a, je rozumné považovat za podezřelou."],"tip":"Podvodné nabídky se někdy snaží vyvolat spěch. Když je něco „jen na 30 sekund“, je čas být opatrný."},{"q":"V třídní skupině někdo pošle neznámý odkaz na „tajné mince do hry“. Co je nejlepší?","a":["Odkaz ihned otevřu, aby mince nezmizely.","Neotevřu ho a nejdřív ověřím, zda je bezpečný.","Přepošlu ho všem kontaktům.","Zadám na stránce heslo ke školnímu e-mailu."],"c":1,"f":["Odkaz může vést na škodlivou nebo podvodnou stránku.","Ověření odkazu mimo podezřelou zprávu je bezpečnější než uspěchané kliknutí.","Přeposílání může ohrozit i další děti.","Heslo ke školnímu účtu nepatří na neznámé weby."],"tip":"I zpráva od kamaráda může obsahovat škodlivý odkaz, pokud se někdo dostal do jeho účtu."},{"q":"Chceš dát na internet fotografii spolužáka z výletu. Co máš nejdřív udělat?","a":["Zveřejnit ji, protože jste kamarádi.","Přidat k fotce jeho telefonní číslo.","Zeptat se na souhlas a respektovat, když nechce.","Poslat fotku každému neznámému účtu."],"c":2,"f":["Kamarádství neznamená automatický souhlas se zveřejněním fotky.","Telefonní číslo je osobní údaj, který nemáš zveřejňovat.","Zveřejnění fotografie může zasáhnout do soukromí druhého člověka.","Neznámým účtům fotografie neposílej."],"tip":"Na fotografii může být vidět i to, co si člověk nevšimne: číslo domu, název školy nebo poloha místa."},{"q":"V chatu se někdo posmívá spolužačce a ostatní přidávají ošklivé zprávy. Co uděláš?","a":["Přidám další vtip, aby nebylo ticho.","Zprávy dál nešířím, podpořím spolužačku a řeknu o tom dospělému.","Udělám z těch zpráv veřejný obrázek.","Budu se jen dívat, protože se mě to netýká."],"c":1,"f":["Posměch může spolužačce ublížit, i když je označen za vtip.","Podpora a pomoc důvěryhodného dospělého mohou ubližování zastavit.","Veřejným šířením se ponižující obsah dostane k dalším lidem.","Svědek může bezpečně pomoci tím, že ubližování nenapodobí a upozorní dospělého."],"tip":"Když někdo opakovaně ubližuje přes mobil nebo internet, může jít o kyberšikanu. Zprávy se dají uchovat jako důkaz."},{"q":"Hráč, kterého znáš jen z internetu, tě zve na schůzku bez rodičů. Jak se zachováš?","a":["Nepůjdu sám/sama a hned o pozvání řeknu důvěryhodnému dospělému.","Půjdu, když bude setkání krátké.","Domluvím se tajně po škole.","Pošlu mu svou polohu a počkám, až přijde."],"c":0,"f":["Setkání s neznámou osobou musí řešit důvěryhodný dospělý.","Krátké setkání není automaticky bezpečné.","Tajná schůzka zvyšuje riziko, protože nikdo neví, kde jsi.","Sdílení polohy s neznámou osobou tě může ohrozit."],"tip":"Fotografie, věk i jméno na cizím profilu mohou být smyšlené."},{"q":"Dokončil/a jsi práci na společném školním počítači. Co uděláš před odchodem?","a":["Nechám otevřený školní e-mail.","Uložím heslo do prohlížeče pro ostatní.","Nechám rozepsanou zprávu v chatu.","Odhlásím se ze svého školního účtu."],"c":3,"f":["Další žák by mohl číst tvé zprávy nebo pracovat pod tvým jménem.","Na společném zařízení neukládej heslo pro ostatní.","Otevřená konverzace může odhalit soukromé informace.","Odhlášení chrání tvé zprávy a školní soubory před dalšími uživateli."],"tip":"Zamčení obrazovky není totéž jako odhlášení. Na sdíleném počítači nezapomeň ukončit svůj účet."},{"q":"Chceš do tabletu nainstalovat novou hru. Který postup je nejbezpečnější?","a":["Stáhnu ji z první reklamy, kterou uvidím.","Nainstaluji neznámý soubor zaslaný v chatu.","Nejprve se poradím s rodičem a použiji důvěryhodný zdroj aplikací.","Vypnu ochranu tabletu, aby instalace šla rychleji."],"c":2,"f":["Reklama může vést i na nebezpečný web.","Neznámé instalační soubory mohou obsahovat škodlivé programy.","Kontrola zdroje a pomoc dospělého snižují riziko škodlivé aplikace.","Vypnutím ochrany zvyšuješ riziko napadení zařízení."],"tip":"Aplikace někdy žádají přístup ke kameře, mikrofonu či poloze. Je dobré se ptát, zda ho opravdu potřebují."},{"q":"Na internetu narazíš na video, které tě vyděsí. Co je rozumné udělat?","a":["Video zavřít a svěřit se dospělému, kterému věříš.","Pouštět si video pořád dokola, abych si zvykl/a.","Poslat ho mladším dětem.","Předstírat, že se nic nestalo, i když mám strach."],"c":0,"f":["Zavřít nepříjemný obsah a požádat o podporu je dobré řešení.","Opakované sledování může nepříjemný pocit ještě zvětšit.","Strašidelný obsah může vyděsit i ostatní děti.","Když tě něco na internetu trápí, má smysl o tom mluvit."],"tip":"Na internetu nemusíš sledovat všechno až do konce. Můžeš kdykoli zavřít stránku nebo aplikaci."},{"q":"Přijde ti zpráva od účtu se jménem kamaráda, ale píše nezvykle a chce tajemství. Co uděláš?","a":["Hned mu prozradím tajemství.","Ověřím u kamaráda jinou známou cestou, zda zprávu opravdu poslal.","Zveřejním naše staré soukromé zprávy.","Pošlu mu heslo pro potvrzení přátelství."],"c":1,"f":["Název profilu se dá napodobit a účet může být zneužitý.","Osobní ověření nebo jiný známý kontakt pomůže zjistit, kdo píše.","Soukromé zprávy nemá smysl zveřejňovat kvůli podezření.","Heslo nikdy není důkazem přátelství."],"tip":"Někdo může použít stejnou fotografii a podobné jméno jako skutečný kamarád."},{"q":"V chatu se šíří zpráva: „Zítra je škola zavřená!“ Kde to nejlépe ověříš?","a":["Podle počtu smajlíků ve zprávě.","Podle toho, kolikrát ji někdo přeposlal.","Podle anonymního komentáře pod videem.","U učitele, rodiče nebo v oficiálním oznámení školy."],"c":3,"f":["Smajlíky nevypovídají nic o pravdivosti informace.","I nepravdivá zpráva se může šířit velmi rychle.","Anonymní komentář není oficiální informací školy.","Oficiální školní kanály a učitelé mohou podobnou informaci spolehlivě potvrdit."],"tip":"Ne každá zpráva na internetu je pravdivá. Před přeposláním je dobré zjistit, odkud pochází."},{"q":"Přijde ti SMS s jednorázovým kódem k přihlášení. Někdo v chatu tě prosí, ať mu ho pošleš. Co uděláš?","a":["Kód nikomu nepošlu a řeknu o žádosti dospělému.","Pošlu kód jen na chvilku.","Vložím kód do veřejného příspěvku.","Pošlu kód, pokud člověk zná moji přezdívku."],"c":0,"f":["Jednorázový kód může pomoci získat přístup k účtu, proto ho nikomu nedávej.","I krátké sdělení kódu může stačit k jeho zneužití.","Veřejný příspěvek zpřístupní kód mnoha lidem.","Znalost přezdívky nedokazuje, že člověk jedná bezpečně."],"tip":"Druhý způsob ověření přihlášení se často nazývá dvoufaktorové ověření. Tajný kód patří jen tobě."},{"q":"Na internetu tě někdo vyzve, abys kvůli zhlédnutím udělal/a nebezpečný úkol. Co uděláš?","a":["Pokusím se o něj jen jednou.","Udělám ho, pokud ho zkouší i spolužáci.","Výzvu odmítnu a poradím se s dospělým.","Nejprve k ní přemluvím kamaráda."],"c":2,"f":["I jediný pokus může způsobit zranění.","To, že něco dělají ostatní, neznamená, že je to bezpečné.","Zdraví je důležitější než počet zhlédnutí nebo lajků.","Přemlouvání dalšího dítěte vytváří riziko i pro něj."],"tip":"Video může být sestříhané a nemusí ukazovat, co se stalo před natáčením nebo po něm."},{"q":"Ve škole zjistíš, že jsi někde zapomněl/a školní tablet. Co uděláš jako první?","a":["Počkám do příštího týdne.","Hned to oznámím učiteli nebo školnímu správci.","Napíšu veřejně jeho přihlašovací heslo.","Půjdu ho hledat mimo školu bez vědomí dospělých."],"c":1,"f":["Při ztrátě zařízení je důležité jednat co nejdříve.","Učitel nebo správce může pomoci zařízení najít a zabezpečit školní účet.","Zveřejňování hesla by situaci ještě zhoršilo.","Hledání mimo školu bez vědomí dospělých není bezpečné."],"tip":"Některá školní zařízení lze spravovat na dálku, například uzamknout nebo z nich odhlásit účet."}];
const app=document.getElementById('app');

function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
const themes=[['#4d9dc6','#a1e0d2'],['#5f8eda','#c8bdf0'],['#e7ac6a','#f3d9aa'],['#60aca1','#a4ddd0'],['#ad8eca','#e4b9cd'],['#66a5da','#acd7f1'],['#e4a66e','#f3d6ba'],['#7e9bd5','#b8d3ea'],['#7cc6ab','#bfecdb'],['#93a8dc','#d4c3ec'],['#74b6d7','#bbe7f1'],['#ddad83','#ebd8aa'],['#648db7','#9dc4da'],['#bf9ac9','#e9c6dc'],['#58aaa4','#abd9b3']];
function introduction(){position=-1;answers=[];app.innerHTML=`<section class="hero"><div class="tag">Tvá internetová mise začíná</div><h1>Kyberhrdinové:<br>Bezpečně na internetu</h1><p>Dokážeš poznat bezpečné rozhodnutí ve hře, v chatu i při používání školního počítače? Čeká tě 15 krátkých situací.</p><div class="orb"></div><div class="orb orb2"></div><svg class="shield" width="126" height="140" viewBox="0 0 120 140" fill="none" aria-hidden="true"><path d="M60 7 105 25V62c0 36-18 53-45 69C33 115 15 98 15 62V25L60 7Z" fill="#ffffff29" stroke="#f5ffff" stroke-width="5"/><path d="m38 69 16 16 29-34" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></section><section class="body"><div class="intro-meta"><div class="meta"><strong>15</strong><span>otázek</span></div><div class="meta"><strong>4</strong><span>možnosti</span></div><div class="meta"><strong>1</strong><span>správná</span></div></div><p>Po každé odpovědi se dozvíš, proč je dobrá nebo nebezpečná, a objevíš zajímavost. Na konci získáš body a povzbuzení. Nikam se neposílají tvé odpovědi ani osobní údaje.</p><div class="actions"><button class="btn" id="start">Začít výpravu →</button><button class="btn secondary" id="share">Sdílet do Google Učebny</button></div><div class="sharing hide" id="sharebox"></div></section>`;document.getElementById('start').onclick=()=>{position=0;draw()};document.getElementById('share').onclick=share;
}
function draw(){const x=QUESTIONS[position],col=themes[position],answered=answers.length>position,selected=answered?answers[position]:null;
const bg=`linear-gradient(125deg,${col[0]},${col[1]})`;
app.innerHTML=`<div class="body"><div class="progresshead"><span>Otázka ${position+1} z ${QUESTIONS.length}</span><span>Digitální dobrodružství</span></div><div class="track"><div class="fill" style="width:${Math.round(100*(position+1)/QUESTIONS.length)}%"></div></div><div class="scene" style="background:${bg}" aria-hidden="true"><div class="screen"></div><div class="bubble"></div><div class="dot"></div><div class="dot dot2"></div><div class="swirl"></div></div><div class="topic">Mise ${position+1}: Rozhodni se bezpečně</div><div class="question">${esc(x.q)}</div><div class="options" id="opts">${x.a.map((text,i)=>`<button type="button" class="answer${answered&&i===x.c?' right':''}${answered&&i===selected&&i!==x.c?' wrong':''}" data-num="${i}" ${answered?'disabled':''}><span class="letter">${letters[i]}</span><span>${esc(text)}</span></button>`).join('')}</div><div id="response">${answered?feedback(x,selected):''}</div><div class="nav"><div class="score">Body: ${points()} / ${QUESTIONS.length}</div><button class="btn" id="next" ${answered?'':'disabled'}>${position===QUESTIONS.length-1?'Zobrazit výsledek':'Další otázka →'}</button></div></div>`;
app.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answers.length>position)return;answers.push(Number(b.dataset.num));draw()});document.getElementById('next').onclick=()=>{if(answers.length<=position)return;position++;if(position<QUESTIONS.length)draw();else result()};}
function feedback(x,n){return `<div class="feedback"><h3>${n===x.c?'🌟 Výborně, bezpečná volba!':'💡 Důležitá věc k zapamatování'}</h3><p>${esc(x.f[n])}</p>${n===x.c?'':`<p><b>Nejlepší odpověď:</b> ${esc(x.a[x.c])}</p>`}<div class="didyouknow"><b>Věděl/a jsi, že…</b><br>${esc(x.tip)}</div></div>`}
function points(){return answers.reduce((sum,a,i)=>sum+(a===QUESTIONS[i].c?1:0),0)}
function tier(p){if(p>=13)return ['Internetový superhrdina!','Výborně! Umíš poznat nebezpečné situace a víš, kdy požádat o pomoc. Buď stejně opatrný/á i při skutečném používání internetu.','🏆'];if(p>=10)return ['Šikovný kyberochránce!','Skvělá práce! Důležitým pravidlům dobře rozumíš. Zkus si připomenout otázky, u kterých jsi zaváhal/a.','🌟'];if(p>=7)return ['Rostoucí digitální hrdina!','Dobrá práce! Už znáš několik bezpečných kroků. Přečti si vysvětlení a při příštím pokusu to zvládneš ještě lépe.','🧭'];return ['Odvážný začátečník!','Každý hrdina se nejprve učí. Důležité je umět se zastavit, přemýšlet a požádat o pomoc. Zkus to znovu!','🌱']}
function result(){const p=points(),[heading,msg,emoji]=tier(p),percentage=Math.round(p/QUESTIONS.length*100);
app.innerHTML=`<section class="hero" style="min-height:180px;padding:29px 36px"><div class="tag">Výprava dokončena</div><h1 style="font-size:34px">Tvoje kybermise skončila!</h1><p>Každá bezpečná volba se počítá.</p><div class="orb"></div></section><section class="result"><div style="font-size:48px">${emoji}</div><div class="big">${p} / ${QUESTIONS.length}</div><div class="pill" style="display:inline-block;margin:10px">Úspěšnost ${percentage} %</div><h2>${heading}</h2><p>${msg}</p><div class="actions" style="justify-content:center"><button class="btn" id="again">Zkusit znovu ↻</button><button class="btn secondary" id="print">Vytisknout výsledek / PDF</button><button class="btn secondary" id="save">Stáhnout výsledek</button></div><div class="summary"><b>Podívej se na své odpovědi</b>${QUESTIONS.map((x,i)=>`<details><summary>${answers[i]===x.c?'✅':'🔎'} ${i+1}. ${esc(x.q)}</summary><p><strong>Tvá odpověď:</strong> ${esc(x.a[answers[i]])}</p><p><strong>Správná odpověď:</strong> ${esc(x.a[x.c])}</p><p>${esc(x.tip)}</p></details>`).join('')}</div><button type="button" class="btn plain" id="share">Sdílet odkaz na kvíz</button><div class="sharing hide" id="sharebox"></div></section>`;
document.getElementById('again').onclick=introduction;document.getElementById('print').onclick=()=>window.print();document.getElementById('save').onclick=save;document.getElementById('share').onclick=share;}
function save(){let lines=['Kyberhrdinové – Kyberbezpečnost (4. třída)','Výsledek: '+points()+' / 15','Úspěšnost: '+Math.round(points()/15*100)+' %',''];QUESTIONS.forEach((x,i)=>{lines.push((i+1)+'. '+x.q);lines.push('Vybraná: '+x.a[answers[i]]);lines.push('Správná: '+x.a[x.c]);lines.push('')});const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vysledek_kyberbezpecnost_4_trida.txt';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
function share(){const box=document.getElementById('sharebox');box.classList.remove('hide');if(!/^https?:$/.test(location.protocol)){box.innerHTML='<strong>Pro sdílení nejprve zveřejni kvíz</strong><p class="small">Soubor otevřený z počítače nemá veřejnou internetovou adresu. Nahraj balíček ZIP na Netlify Drop a teprve zveřejněnou adresu vlož do Google Učebny.</p>';return}const link=location.origin+location.pathname;box.innerHTML='<strong>Odkaz pro Google Učebnu</strong><input class="url" id="shareurl" readonly value="'+esc(link)+'" aria-label="Veřejná adresa kvízu"><div class="actions"><button class="btn secondary" id="copylink">Kopírovat adresu</button><button class="btn plain" id="selectlink">Označit adresu</button></div><p class="alert" id="status">Použij v Google Učebně jako odkaz na úkol nebo materiál.</p>';const field=document.getElementById('shareurl');document.getElementById('selectlink').onclick=()=>{field.select();field.focus()};document.getElementById('copylink').onclick=async()=>{try{await navigator.clipboard.writeText(link);document.getElementById('status').textContent='Adresa byla zkopírována.'}catch(e){field.select();field.focus();document.getElementById('status').textContent='Adresa je označená. Zkopíruj ji klávesami Ctrl+C.'}};}
introduction();
</script></body></html>
